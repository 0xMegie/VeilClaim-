# Local Midnight proof server. Point Lace's proof-server setting at http://localhost:6300.
# Image version is tied to ledger-v8 / midnight-js 4.1.x — bump together.
services:
  proof-server:
    image: midnightntwrk/proof-server:8.0.3
    command: ['midnight-proof-server', '--network', 'preprod']
    ports:
      - '6300:6300'
